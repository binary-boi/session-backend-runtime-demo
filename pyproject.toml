[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "session-backend-runtime-demo"
version = "1.0.0"
description = "A small Python demo of safe runtime session-backend reconfiguration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "redis>=5.0,<6.0",
  "pymemcache>=4.0,<5.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
